name: "Validate with hassfest"

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    name: "Hassfest validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v4"

      - name: "Run Hassfest"
        uses: "home-assistant/actions/hassfest@master"
