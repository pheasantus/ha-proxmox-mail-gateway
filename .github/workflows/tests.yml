name: "CI Pipeline"

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: "Tests, Linting and Security"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v4"

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: "Run Ruff linter"
        run: ruff check custom_components/ tests/

      - name: "Run Mypy static type checker"
        run: mypy custom_components/ tests/

      - name: "Run Bandit security scan"
        run: bandit -r custom_components/ -c pyproject.toml

      - name: "Run Pytest test suite"
        run: pytest tests/ --cov=custom_components.proxmox_mail_gateway --cov-report=term-missing
